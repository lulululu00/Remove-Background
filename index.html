<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1e23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>白底去背工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 版面：頂部工具列＋模型狀態，下方是成品卡片格；修正時開啟全螢幕編輯層 */
:root {
  --bg: #eceef0;
  --panel: #f8f9fa;
  --stage: #d7dbdf;
  --ink: #1a1e23;
  --muted: #626b75;
  --line: #d3d8dd;
  --accent: #c4352b;
  --keep: #23865a;
  --warn-bg: #fbeee6;
  --warn-ink: #8a3a12;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171a; --panel: #1c2024; --stage: #2a2f35; --ink: #e4e8ec; --muted: #98a2ad; --line: #2f353c;
  --accent: #ea5a4e; --keep: #4cc489; --warn-bg: #3a2418; --warn-ink: #f3b48f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14171a; --panel: #1c2024; --stage: #2a2f35; --ink: #e4e8ec; --muted: #98a2ad; --line: #2f353c;
  --accent: #ea5a4e; --keep: #4cc489; --warn-bg: #3a2418; --warn-ink: #f3b48f; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
header.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { margin-right: auto; min-width: 0; display: flex; flex-direction: column; }
.brand h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
button, .btn { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; position: relative; }
button:hover, .btn:hover { border-color: var(--muted); }
button:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary, .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:disabled { opacity: .45; cursor: default; }
.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-state="ready"] .dot { background: var(--keep); }
.status[data-state="error"] .dot { background: var(--accent); }
.status[data-state="loading"] .dot { background: #d29a2e; }
.status .txt { flex: 1; min-width: 0; }
.meter { flex: 0 1 220px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
.status .eng { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.shot { position: relative; background: var(--stage); aspect-ratio: 1 / 1; display: grid; place-items: center; padding: 10px; max-width: 100%; }
.shot img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.08); }
.shot .badge { position: absolute; left: 10px; top: 10px; font-size: 11.5px; border-radius: 99px; padding: 2px 9px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.shot .badge.done { color: var(--keep); }
.shot .peek { position: absolute; right: 10px; bottom: 10px; padding: 4px 10px; font-size: 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
.card .foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.card .name { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .size { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .foot button { padding: 6px 11px; font-size: 12.5px; }
.empty { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); }

.editor { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ed-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ed-bar .title { font-weight: 700; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; padding: 7px 12px; background: none; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button[data-tool="keep"][aria-pressed="true"] { background: var(--keep); color: var(--panel); }
.seg button[data-tool="remove"][aria-pressed="true"] { background: var(--accent); color: #fff; }
.ed-stage { background: var(--stage); display: grid; place-items: center; overflow: hidden; padding: 14px; min-height: 0; position: relative; }
.frame { position: relative; line-height: 0; max-width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); }
.frame canvas { display: block; max-width: 100%; max-height: calc(100vh - 170px); width: auto; height: auto; }
.frame canvas.ov { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; pointer-events: none; }
.frame.painting canvas#edView { touch-action: none; cursor: none; }
.cursor { position: absolute; border-radius: 50%; pointer-events: none; border: 1.5px solid var(--ink); box-shadow: 0 0 0 1px var(--panel); transform: translate(-50%, -50%); }
.ed-busy { position: absolute; top: 12px; left: 12px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; color: var(--muted); }
.ed-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; background: var(--panel); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; color: var(--muted); }
.ed-foot label { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.ed-foot input[type=range] { width: 140px; accent-color: var(--ink); }
.ed-foot .sp { margin-left: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 60; max-width: calc(100vw - 32px); }
.drop-cover { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); display: grid; place-items: center; z-index: 50; font-size: 18px; font-weight: 700; border: 3px dashed var(--accent); }
@media (max-width: 600px) { .grid { grid-template-columns: minmax(0, 1fr); } .meter { flex-basis: 100%; } .frame canvas { max-height: calc(100vh - 230px); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand"><h1>白底去背工作台</h1><p>AI 去背，再合成純白背景（#FFFFFF），保留物件、標籤和自然陰影，輸出原始尺寸。</p></div>
    <div class="seg" role="group" aria-label="輸出格式" id="fmt">
      <button type="button" data-fmt="png" aria-pressed="true" title="無損，畫質完全不壓縮，檔案較大">PNG 無損</button>
      <button type="button" data-fmt="jpg" aria-pressed="false" title="品質 95%，檔案較小">JPG</button>
    </div>
    <label class="btn" for="file">上傳圖片<input id="file" type="file" accept="image/*" multiple></label>
    <button id="dlAll" class="primary" type="button">全部下載 ZIP</button>
  </header>
  <div class="status" id="status" data-state="loading">
    <span class="dot"></span><span class="txt" id="statusTxt">正在載入 AI 模型…</span>
    <span class="meter" id="meter"><i id="meterBar"></i></span>
    <span class="eng" id="engine"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>把商品照拖進來，或按「上傳圖片」。也可以直接 Ctrl+V 貼上。</div>
</div>

<div class="editor" id="editor" hidden>
  <div class="ed-bar">
    <span class="title" id="edTitle"></span>
    <div class="seg" role="group" aria-label="筆刷">
      <button type="button" data-tool="keep" aria-pressed="false">保留筆刷</button>
      <button type="button" data-tool="remove" aria-pressed="true">移除筆刷</button>
    </div>
    <div class="seg" role="group" aria-label="預覽">
      <button type="button" data-ev="result" aria-pressed="true">結果</button>
      <button type="button" data-ev="orig" aria-pressed="false">原圖</button>
    </div>
    <button id="edDone" class="primary" type="button">完成</button>
  </div>
  <div class="ed-stage">
    <div class="frame painting" id="edFrame">
      <canvas id="edView" width="10" height="10"></canvas>
      <canvas id="edOv" class="ov" width="10" height="10"></canvas>
      <div class="cursor" id="edCursor" hidden></div>
    </div>
    <span class="ed-busy" id="edBusy" hidden>重新計算中…</span>
  </div>
  <div class="ed-foot">
    <label for="bsize">筆刷大小 <input id="bsize" type="range" min="6" max="160" value="40"></label>
    <button id="edUndo" type="button">復原</button>
    <button id="edClear" type="button">清除筆刷</button>
    <span class="sp">綠色塗在被誤刪的物件上，紅色塗在多留下來的雜物上，放開後自動更新。</span>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="drop-cover" id="dropCover" hidden>放開即可加入圖片</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script id="worker-src" type="text/plain">
// 去背核心：邊緣感知的背景區域成長（從圖片四邊向內擴張）
// rgba: Uint8ClampedArray (w*h*4)。回傳 Float32Array alpha，1 = 保留物件，0 = 背景
function computeMask(rgba, w, h, opt) {
  const tol = opt.tol;        // 相鄰像素顏色變化容許值 (0-255)
  const edge = opt.edge;      // 邊緣強度門檻 (0-255)
  const shrink = opt.shrink;  // 物件邊緣內縮像素
  const N = w * h;
  // 1. 模糊（兩次 3x3 box）
  let c = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { c[i*3] = rgba[i*4]; c[i*3+1] = rgba[i*4+1]; c[i*3+2] = rgba[i*4+2]; }
  const blur = (src) => {
    const tmp = new Float32Array(N * 3), out = new Float32Array(N * 3);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const xl = x > 0 ? x - 1 : x, xr = x < w - 1 ? x + 1 : x;
      for (let k = 0; k < 3; k++) tmp[(y*w+x)*3+k] = (src[(y*w+xl)*3+k] + src[(y*w+x)*3+k] + src[(y*w+xr)*3+k]) / 3;
    }
    for (let y = 0; y < h; y++) { const yu = y > 0 ? y - 1 : y, yd = y < h - 1 ? y + 1 : y;
      for (let x = 0; x < w; x++) for (let k = 0; k < 3; k++)
        out[(y*w+x)*3+k] = (tmp[(yu*w+x)*3+k] + tmp[(y*w+x)*3+k] + tmp[(yd*w+x)*3+k]) / 3; }
    return out;
  };
  c = blur(blur(c));
  // 2. Sobel 邊緣強度（取三通道最大）
  const g = new Float32Array(N);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    let m = 0;
    for (let k = 0; k < 3; k++) {
      const p = (yy, xx) => c[(yy*w+xx)*3+k];
      const gx = p(y-1,x+1) + 2*p(y,x+1) + p(y+1,x+1) - p(y-1,x-1) - 2*p(y,x-1) - p(y+1,x-1);
      const gy = p(y+1,x-1) + 2*p(y+1,x) + p(y+1,x+1) - p(y-1,x-1) - 2*p(y-1,x) - p(y-1,x+1);
      const v = Math.sqrt(gx*gx + gy*gy) / 4;
      if (v > m) m = v;
    }
    g[y*w+x] = m;
  }
  // 2b. 邊緣膨脹 R px（可分離最大值濾波），堵住輪廓缺口避免滲漏
  const R = opt.seal;
  const g0 = g.slice();
  if (R > 0) { const t = new Float32Array(N);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let m = 0;
      for (let d = -R; d <= R; d++) { const xx = x + d; if (xx >= 0 && xx < w && g[y*w+xx] > m) m = g[y*w+xx]; } t[y*w+x] = m; }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let m = 0;
      for (let d = -R; d <= R; d++) { const yy = y + d; if (yy >= 0 && yy < h && t[yy*w+x] > m) m = t[yy*w+x]; } g[y*w+x] = m; } }
  // 3. 從四邊擴張背景
  const bg = new Uint8Array(N);
  const q = new Int32Array(N); let qh = 0, qt = 0;
  const ref = new Float32Array(N * 3); // 背景參考色（緩慢跟隨漸層）
  const drift = opt.drift;
  const setRef = (n, p) => { if (p < 0) { ref[n*3] = c[n*3]; ref[n*3+1] = c[n*3+1]; ref[n*3+2] = c[n*3+2]; return; }
    for (let k = 0; k < 3; k++) ref[n*3+k] = ref[p*3+k] * 0.85 + c[n*3+k] * 0.15; };
  const seed = (i) => { if (!bg[i] && g[i] <= edge * 1.5) { bg[i] = 1; setRef(i, -1); q[qt++] = i; } };
  // 框選範圍：框外一律視為背景，種子放在框的四邊
  const roi = opt.roi || { x0: 0, y0: 0, x1: 1, y1: 1 };
  const X0 = Math.max(0, Math.round(roi.x0 * w)), Y0 = Math.max(0, Math.round(roi.y0 * h));
  const X1 = Math.min(w - 1, Math.round(roi.x1 * w) - 1), Y1 = Math.min(h - 1, Math.round(roi.y1 * h) - 1);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (x < X0 || x > X1 || y < Y0 || y > Y1) { const i = y*w+x; bg[i] = 1; setRef(i, -1); }
  for (let x = X0; x <= X1; x++) { seed(Y0*w + x); seed(Y1*w + x); }
  for (let y = Y0; y <= Y1; y++) { seed(y*w + X0); seed(y*w + X1); }
  // 手動標記：hint 1=強制背景 2=強制保留
  const hint = opt.hint;
  if (hint) for (let i = 0; i < N; i++) if (hint[i] === 1 && !bg[i]) { bg[i] = 1; setRef(i, -1); q[qt++] = i; }
  while (qh < qt) {
    const p = q[qh++], px = p % w, py = (p / w) | 0;
    const nb = [px > 0 ? p - 1 : -1, px < w - 1 ? p + 1 : -1, py > 0 ? p - w : -1, py < h - 1 ? p + w : -1];
    for (const n of nb) {
      if (n < 0 || bg[n]) continue;
      if (hint && hint[n] === 2) continue;
      if (g[n] > edge) continue;
      const d = Math.max(Math.abs(c[p*3]-c[n*3]), Math.abs(c[p*3+1]-c[n*3+1]), Math.abs(c[p*3+2]-c[n*3+2]));
      if (d > tol) continue;
      const r = Math.max(Math.abs(ref[p*3]-c[n*3]), Math.abs(ref[p*3+1]-c[n*3+1]), Math.abs(ref[p*3+2]-c[n*3+2]));
      if (r > drift) continue;
      bg[n] = 1; setRef(n, p); q[qt++] = n;
    }
  }
  // 3b. 貼邊細修：在封口帶內，用未膨脹的邊緣圖再往內擴張最多 R+1 px
  if (R + opt.band > 0) { let front = []; for (let i = 0; i < qt; i++) front.push(q[i]);
    for (let step = 0; step <= R + opt.band && front.length; step++) { const nf = [];
      for (const p of front) { const px = p % w, py = (p / w) | 0;
        const nb = [px > 0 ? p - 1 : -1, px < w - 1 ? p + 1 : -1, py > 0 ? p - w : -1, py < h - 1 ? p + w : -1];
        for (const n of nb) { if (n < 0 || bg[n]) continue; if (hint && hint[n] === 2) continue;
          const r = Math.max(Math.abs(ref[p*3]-c[n*3]), Math.abs(ref[p*3+1]-c[n*3+1]), Math.abs(ref[p*3+2]-c[n*3+2]));
          if (r > drift) continue;
          bg[n] = 1; setRef(n, p); nf.push(n); } }
      front = nf; } }
  // 3c. 陰影：從背景往內，吃掉「只是變暗、顏色不變」的區域（陰影屬於背景）
  if (opt.shadow) {
    qh = 0; qt = 0;
    for (let i = 0; i < N; i++) if (bg[i]) { const x = i % w, y = (i / w) | 0;
      if ((x > 0 && !bg[i-1]) || (x < w-1 && !bg[i+1]) || (y > 0 && !bg[i-w]) || (y < h-1 && !bg[i+w])) q[qt++] = i; }
    const sEdge = edge * opt.shadowEdge;
    while (qh < qt) {
      const p = q[qh++], px = p % w, py = (p / w) | 0;
      const nb = [px > 0 ? p - 1 : -1, px < w - 1 ? p + 1 : -1, py > 0 ? p - w : -1, py < h - 1 ? p + w : -1];
      for (const n of nb) {
        if (n < 0 || bg[n]) continue;
        if (hint && hint[n] === 2) continue;
        if (g[n] > sEdge) continue;
        const k0 = c[n*3] / Math.max(8, ref[p*3]), k1 = c[n*3+1] / Math.max(8, ref[p*3+1]), k2 = c[n*3+2] / Math.max(8, ref[p*3+2]);
        const km = (k0 + k1 + k2) / 3;
        if (km < 0.35 || km > 1.04) continue;
        if (Math.max(Math.abs(k0-km), Math.abs(k1-km), Math.abs(k2-km)) > opt.shadowChroma) continue;
        const d = Math.max(Math.abs(c[p*3]-c[n*3]), Math.abs(c[p*3+1]-c[n*3+1]), Math.abs(c[p*3+2]-c[n*3+2]));
        if (d > tol * 2) continue;
        bg[n] = 1; ref[n*3] = ref[p*3]; ref[n*3+1] = ref[p*3+1]; ref[n*3+2] = ref[p*3+2]; q[qt++] = n;
      }
    }
  }
  // 3d. 邊框雜物：從畫面邊緣、沿著「有紋理且顏色相近」的區域往內清除（例如布幕）
  if (opt.clutter) {

        // 關掉 im2col：它會為每層建出數百 MB 的暫存矩陣，顯示卡記憶體不足時會慢到好幾分鐘
        tf.env().set('WEBGL_CONV_IM2COL', false);
        if (!(await tf.setBackend('webgl'))) throw new Error('no gpu');
        await tf.ready(); eng = 'WebGL';
        try { const gl = document.createElement('canvas').getContext('webgl'); const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
          const r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
          if (/swiftshader|llvmpipe|software|basic render/i.test(r)) { st.S = 512; eng += '（未啟用硬體加速）'; } } catch (e) {}
      }
      st.eng = eng;
      setStatus('loading', '準備 AI 模型…', null, eng);
      W = {};
      for (const w of MODEL.weights) { const d = weights.subarray(w.off / 2, w.off / 2 + w.n); W[w.id] = tf.tensor(d, w.shape, 'float32'); }
      tfB = {
        conv: (x, w, b, s, p, d, relu) => tf.fused.conv2d({ x, filter: w, strides: [s, s], pad: p, dataFormat: 'NHWC', dilations: [d, d], bias: b, activation: relu ? 'relu' : 'linear' }),
        relu: (x) => tf.relu(x), pool: (x) => tf.maxPool(x, [2, 2], [2, 2], 'same'), add: (a, b) => tf.add(a, b),
        sigmoid: (x) => tf.sigmoid(x), concat: (l) => tf.concat(l, 3), resize: (x, n) => tf.image.resizeBilinear(x, [n, n], false, true),
        free: (t) => t.dispose(),
      };
      st.state = 'ready'; return true;
    } catch (e) {
      console.error(e); st.state = 'off';
      const msg = e.why === 'model-missing' ? `找不到 AI 模型檔「${e.file}」（${e.status}）。請確認 model 資料夾和裡面 6 個檔案都有上傳，且網站已發布完成。目前先用一般去背。`
        : e.why === 'model-net' ? 'AI 模型下載中斷，請確認網路後重新整理頁面。目前先用一般去背。'
        : e.why === 'lib' ? '無法載入 AI 運算元件（可能被網路或防火牆擋住），請重新整理再試。目前先用一般去背。'
        : '這台裝置無法執行 AI 模型（顯示卡不支援），改用一般去背（白色或單色背景效果較好）。';
      setStatus('error', msg, null, '');
      return false;
    }
  })();
  async function predict(it) {
    const ok = await modelReady; if (!ok) return null;
    for (const S of [st.S, 768, 512]) {
      if (S > st.S) continue;
      try {
        const c = document.createElement('canvas'); c.width = c.height = S;
        const x2 = c.getContext('2d'); x2.imageSmoothingQuality = 'high'; x2.drawImage(it.img, 0, 0, S, S);
        const x = tf.tidy(() => tf.browser.fromPixels(c).toFloat().div(255).sub(0.5).expandDims(0));
        const out = runISNet(tfB, MODEL.prog, W, x, S);
        const data = await out.data(); out.dispose();
        st.S = S; return { ai: new Float32Array(data), S };
      } catch (e) { console.warn('AI 失敗，改用較小尺寸', S, e); }
    }
    return null;
  }

  // ---------- 處理流程 ----------
  let chain = Promise.resolve();
  function updateQueueStatus() {
    if (st.state !== 'ready') return;
    const left = items.filter((i) => i.stage !== 'done').length;
    const lastDone = items.filter((i) => i.secs).slice(-1)[0];
    setStatus('ready', left ? `AI 去背中… 還有 ${left} 張` : `AI 模型就緒 · ${items.length} 張已完成` + (lastDone ? `（上一張 ${lastDone.secs.toFixed(1)} 秒）` : ''), null);
  }
  function process(it) {
    chain = chain.then(async () => {
      it.stage = 'ai'; renderCard(it); updateQueueStatus();
      const t0 = performance.now();
      const tick = setInterval(() => { if (st.state === 'ready') { const left = items.filter((i) => i.stage !== 'done').length;
        setStatus('ready', `AI 去背中…「${it.name}」已 ${Math.round((performance.now() - t0) / 1000)} 秒 · 還有 ${left} 張`, null); } }, 1000);
      try {
        const p = await predict(it);
        if (p) { it.ai = p.ai; it.S = p.S; }
        await render(it);
      } finally { clearInterval(tick); }
      it.secs = (performance.now() - t0) / 1000;
      it.stage = 'done'; renderCard(it); updateQueueStatus();
    });
    return chain;
  }
  async function render(it) {
    it.ver = (it.ver || 0) + 1; const ver = it.ver;
    const m = await call({ type: 'render', id: it.id, ver, rgba: it.work.data, w: it.wW, h: it.wH, ai: it.ai, S: it.S, cls: it.cls, hint: it.hint }, ver);
    if (ver !== it.ver) return;
    it.alpha = m.alpha; it.plate = m.plate; it.sh = m.sh;
    const c = document.createElement('canvas'); c.width = it.wW; c.height = it.wH;
    c.getContext('2d').putImageData(new ImageData(m.out, it.wW, it.wH), 0, 0);
    it.preview = c; it.previewUrl = c.toDataURL('image/jpeg', 0.9);
    renderCard(it);
    if (editing === it) drawEditor();
  }
  function addImage(src, name) {
    const img = new Image();
    img.onload = async () => {
      const Wd = img.naturalWidth, Hd = img.naturalHeight, s = Math.min(1, WORK_MAX / Math.max(Wd, Hd));
      const wW = Math.max(1, Math.round(Wd * s)), wH = Math.max(1, Math.round(Hd * s));
      const c = document.createElement('canvas'); c.width = wW; c.height = wH;
      const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, wW, wH);
      const it = { id: nextId++, name, img, src, W: Wd, H: Hd, wW, wH, work: x.getImageData(0, 0, wW, wH), hint: new Uint8Array(wW * wH), undo: [], stage: 'wait' };
      items.push(it); renderAll();
      const m = await call({ type: 'cls', id: it.id, rgba: it.work.data, w: wW, h: wH }, '');
      it.cls = m.cls;
      process(it);
    };
    img.onerror = () => toast(`無法讀取「${name}」，請確認是圖片檔`);
    img.src = src;
  }
  function addFiles(files) { [...files].filter((f) => f.type.startsWith('image/')).forEach((f) => addImage(URL.createObjectURL(f), f.name || '貼上的圖片.png')); }
  $('#file').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  let dragDepth = 0;
  addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('#dropCover').hidden = false; } });
  addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropCover').hidden = true; });
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('#dropCover').hidden = true; addFiles(e.dataTransfer.files); });
  addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])]; if (f.length) addFiles(f); });

  // ---------- 卡片 ----------
  function renderAll() { $('#grid').textContent = ''; items.forEach((it) => { it.el = null; renderCard(it); }); $('#empty').hidden = items.length > 0; }
  function renderCard(it) {
    if (!it.el) {
      const el = document.createElement('div'); el.className = 'card';
      el.innerHTML = '<div class="shot"><img alt=""><span class="badge"></span><button class="peek" type="button">按住看原圖</button></div>' +
        '<div class="foot"><span class="name"></span><span class="size"></span><button type="button" data-a="fix">修正</button><button type="button" class="primary" data-a="dl">下載</button></div>';
      const peek = el.querySelector('.peek'), img = el.querySelector('img');
      const show = (o) => { img.src = o ? it.src : (it.previewUrl || it.src); };
      peek.addEventListener('pointerdown', (e) => { e.preventDefault(); show(true); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => peek.addEventListener(ev, () => show(false)));
      el.querySelector('[data-a=fix]').onclick = () => openEditor(it);
      el.querySelector('[data-a=dl]').onclick = (e) => downloadOne(it, e.currentTarget);
      $('#grid').appendChild(el); it.el = el;
    }
    const el = it.el;
    el.querySelector('img').src = it.previewUrl || it.src;
    el.querySelector('.name').textContent = it.name; el.querySelector('.name').title = it.name;
    el.querySelector('.size').textContent = `${it.W}×${it.H}`;
    const b = el.querySelector('.badge');
    b.textContent = it.stage === 'done' ? (it.ai ? '完成' : '完成・一般去背') : it.stage === 'ai' ? '去背中…' : '排隊中';
    b.className = 'badge' + (it.stage === 'done' ? ' done' : '');
    el.querySelectorAll('.foot button').forEach((x) => x.disabled = it.stage !== 'done');
    el.querySelector('.peek').hidden = it.stage !== 'done';
  }

  // ---------- 修正編輯器 ----------
  let editing = null, tool = 'remove', edView = 'result', painting = false, last = null;
  const cv = $('#edView'), ov = $('#edOv'), cursor = $('#edCursor'), frame = $('#edFrame');
  function openEditor(it) {
    editing = it; cv.width = ov.width = it.wW; cv.height = ov.height = it.wH;
    $('#edTitle').textContent = it.name; $('#editor').hidden = false; drawEditor();
  }
  $('#edDone').onclick = () => { $('#editor').hidden = true; editing = null; };
  function drawEditor() {
    const it = editing; if (!it) return;
    const x = cv.getContext('2d');
    if (edView === 'orig' || !it.preview) x.putImageData(it.work, 0, 0); else x.drawImage(it.preview, 0, 0);
    drawHint();
  }
  function drawHint() {
    const it = editing, o = ov.getContext('2d'); o.clearRect(0, 0, it.wW, it.wH);
    const img = o.createImageData(it.wW, it.wH), d = img.data, h = it.hint; let any = false;
    for (let i = 0; i < h.length; i++) { if (!h[i]) continue; any = true;
      if (h[i] === 2) { d[i*4] = 35; d[i*4+1] = 170; d[i*4+2] = 100; } else { d[i*4] = 220; d[i*4+1] = 50; d[i*4+2] = 40; } d[i*4+3] = 110; }
    if (any) o.putImageData(img, 0, 0);
  }
  const toWork = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * editing.wW / r.width, y: (e.clientY - r.top) * editing.wH / r.height, k: editing.wW / r.width }; };
  function stamp(x, y, rad, val) {
    const it = editing, h = it.hint, o = ov.getContext('2d');
    const x0 = Math.max(0, Math.floor(x - rad)), x1 = Math.min(it.wW - 1, Math.ceil(x + rad)), y0 = Math.max(0, Math.floor(y - rad)), y1 = Math.min(it.wH - 1, Math.ceil(y + rad));
    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) if ((xx - x) ** 2 + (yy - y) ** 2 <= rad * rad) h[yy * it.wW + xx] = val;
    o.fillStyle = val === 2 ? 'rgba(35,170,100,.43)' : 'rgba(220,50,40,.43)'; o.beginPath(); o.arc(x, y, rad, 0, Math.PI * 2); o.fill();
  }
  const rad = (k) => (+$('#bsize').value / 2) * k;
  cv.addEventListener('pointerdown', (e) => {
    if (!editing) return; e.preventDefault(); cv.setPointerCapture(e.pointerId);
    editing.undo.push(editing.hint.slice()); if (editing.undo.length > 20) editing.undo.shift();
    painting = true; const p = toWork(e); last = p; stamp(p.x, p.y, rad(p.k), tool === 'keep' ? 2 : 1);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!editing) return; const p = toWork(e), fr = frame.getBoundingClientRect(), size = +$('#bsize').value;
    cursor.hidden = false; cursor.style.width = cursor.style.height = size + 'px';
    cursor.style.left = (e.clientX - fr.left) + 'px'; cursor.style.top = (e.clientY - fr.top) + 'px';
    cursor.style.borderColor = tool === 'keep' ? 'var(--keep)' : 'var(--accent)';
    if (painting) { const d = Math.hypot(p.x - last.x, p.y - last.y), r = rad(p.k), n = Math.max(1, Math.ceil(d / (r * .4)));
      for (let i = 1; i <= n; i++) stamp(last.x + (p.x - last.x) * i / n, last.y + (p.y - last.y) * i / n, r, tool === 'keep' ? 2 : 1); last = p; }
  });
  async function rerender() { $('#edBusy').hidden = false; await render(editing); $('#edBusy').hidden = true; }
  const end = () => { if (!painting) return; painting = false; rerender(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => { cursor.hidden = true; });
  function undo() { if (!editing || !editing.undo.length) return; editing.hint = editing.undo.pop(); drawHint(); rerender(); }
  $('#edUndo').onclick = undo;
  $('#edClear').onclick = () => { if (!editing) return; editing.undo.push(editing.hint.slice()); editing.hint = new Uint8Array(editing.wW * editing.wH); drawHint(); rerender(); };
  addEventListener('keydown', (e) => {
    if (!editing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    if (e.key === 'Escape') $('#edDone').click();
  });
  document.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => { tool = b.dataset.tool; document.querySelectorAll('[data-tool]').forEach((x) => x.setAttribute('aria-pressed', x === b)); });
  document.querySelectorAll('[data-ev]').forEach((b) => b.onclick = () => { edView = b.dataset.ev; document.querySelectorAll('[data-ev]').forEach((x) => x.setAttribute('aria-pressed', x === b)); drawEditor(); });

  // ---------- 輸出原始尺寸 ----------
  let jobN = 0;
  function pixels(img, w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h); return x.getImageData(0, 0, w, h).data; }
  async function renderFull(it) {
    const s = Math.min(1, REFINE_MAX / Math.max(it.W, it.H)), wR = Math.round(it.W * s), hR = Math.round(it.H * s);
    const rgbaF = pixels(it.img, it.W, it.H), rgbaR = s === 1 ? rgbaF : pixels(it.img, wR, hR);
    const job = ++jobN;
    const m = await call({ type: 'export', id: it.id, job, rgbaR, wR, hR, rgbaF, W: it.W, H: it.H, alpha: it.alpha, aw: it.wW, ah: it.wH, plate: it.plate, sh: it.sh }, job);
    const c = document.createElement('canvas'); c.width = it.W; c.height = it.H; c.getContext('2d').putImageData(new ImageData(m.out, it.W, it.H), 0, 0);
    return new Promise((res) => fmt === 'png' ? c.toBlob(res, 'image/png') : c.toBlob(res, 'image/jpeg', 0.95));
  }
  let fmt = 'png';
  try { const f = localStorage.getItem('whitebg-fmt'); if (f === 'jpg' || f === 'png') fmt = f; } catch (e) {}
  const syncFmt = () => document.querySelectorAll('[data-fmt]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.fmt === fmt));
  syncFmt();
  document.querySelectorAll('[data-fmt]').forEach((b) => b.onclick = () => { fmt = b.dataset.fmt; syncFmt(); try { localStorage.setItem('whitebg-fmt', fmt); } catch (e) {} });
  const outName = (it) => it.name.replace(/\.[^.]+$/, '') + '_白底.' + fmt;
  let dlP = null;
  async function saveBlob(blob, filename) {
    if (window.claude?.use) {
      dlP = dlP || window.claude.use('downloads'); const dl = await dlP;
      if (dl) { try { await dl.save({ filename, data: blob }); toast('已儲存 ' + filename); } catch (e) { if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? '已有一個下載視窗開著，請先完成它' : '這個檢視無法下載檔案'); } return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  async function downloadOne(it, btn) { btn.disabled = true; const t = btn.textContent; btn.textContent = '輸出中…'; try { await saveBlob(await renderFull(it), outName(it)); } finally { btn.disabled = false; btn.textContent = t; } }
  $('#dlAll').onclick = async () => {
    const done = items.filter((i) => i.stage === 'done'); if (!done.length) return toast('還沒有完成的圖片');
    if (typeof JSZip === 'undefined') return toast('壓縮元件載入失敗，請改用各張的「下載」');
    const b = $('#dlAll'); b.disabled = true;
    try { const zip = new JSZip(), used = new Set();
      for (let i = 0; i < done.length; i++) { b.textContent = `打包中 ${i + 1}/${done.length}`; let n = outName(done[i]); while (used.has(n)) n = n.replace(/(\.\w+)$/, '_' + i + '$1'); used.add(n); zip.file(n, await renderFull(done[i])); }
      await saveBlob(await zip.generateAsync({ type: 'blob' }), '白底圖片.zip');
    } finally { b.disabled = false; b.textContent = '全部下載 ZIP'; }
  };
  let tt = null;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

  modelReady.then(() => updateQueueStatus());
  renderAll();
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
